buttons:

  menu_button:
    slot: 8                      # hotbar slot 9 (index 8) — default menu button
    material: RECOVERY_COMPASS
    name: "&6Navigator"
    lore:
      - '&7View all of your personal'
      - '&7progress including your Skills'
      - '&7Collections, Bestiary, and more!'
      - ''
      - '&eClick to open!'
    command: "/pa open main_menu %player_name%"
    # use "/give %player_name% diamond 1" to run as console
    # Runs as the server console when the command starts with a leading slash.
    execute-on-air-click: true
    execute-on-block-click: true
    protect: true

