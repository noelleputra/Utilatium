main: dev.noellx.utilatium.Utilatium
version: 1.0.0
name: Utilatium
author: Noellx
description: Noelle Private Plugin
api-version: 1.21
depend: [packetevents]
commands:
  particle:
    description: Configure the amount of particles received by a player
    usage: /particle <LOW|MEDIUM|HIGH|EXTREME>
    permission: utilatium.particle
permissions:
  utilatium.particle:
    description: Configure personal particle settings
    default: true